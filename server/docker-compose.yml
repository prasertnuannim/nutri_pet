services:
  postgres:
    image: postgres:16
    container_name: nutripet-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

  postgres-init:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    entrypoint:
      - /bin/sh
      - -c
      - psql -h postgres -U postgres -d postgres -v ON_ERROR_STOP=1 -f /docker-entrypoint-initdb.d/01-create-app-dbs.sql
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
